<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js dom summary</title>
</head>
<body>
    <p id="input-displa" >sample name</p>
    <input id="input-field" type="text">
    <button id="update"> update</button>
    <h1>final dom event handler </h1>
    <h3 id="handler">defult text </h3>
    <button onclick="changeText()"> change defult text</button>
    <button id="addListener"> change defult text</button>
    <script>
function changeText() {
    const text = document.getElementById('handler');
    text.innerText = 'this is a new text';
    text.style.color = 'red';
    text.style.fontSize = '2rem';
    text.style.fontWeight = 'bold';  }

    const text = document.getElementById('addListener');
    text.addEventListener('click', function() {
        const text = document.getElementById('handler');
        text.innerText = 'this is another new text';
        text.style.color = 'red';
        text.style.fontSize = '2rem';
        text.style.fontWeight = 'bold'; 
    });
    document.getElementById('update').addEventListener('click', function(){
const inputField = document.getElementById('input-field');
const inoputText = inputField.value;

const p =document.getElementById('input-displa');
p.innerText = inoputText;
inputField.value = 'Rohim';
    })



    </script>
</body>
</html>

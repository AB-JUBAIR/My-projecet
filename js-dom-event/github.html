<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event listener </title>
</head>
<body>
    <h1 id="text">secrate info</h1> 
    <button id="btn-info">hide</button> <br>
    <input id="text-field" type="text"> <br>
    <button id="btn-delete" disabled> delete</button>
    <script>
document.getElementById('btn-info').addEventListener('click', function(){
    const info = document.getElementById('text').style.display = 'none';
})
document.getElementById('text-field').addEventListener('keyup', function(event){
    const text = event.target.value;
    console.log(text);
    if (text === 'delete') {
        document.getElementById('btn-delete').removeAttribute('disabled')
    }
    else {
                document.getElementById('btn-delete').setAttribute('disabled', true);

    }
    
})
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"
            type="text/css" />
        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>Document</title>
    </head>
    <body>
        <main class="flex justify-center">
            <div class="mockup-phone border-primary">
                <div class="mockup-phone-camera"></div>
                <div class="mockup-phone-display">
                    <!-- log in secttion -->
                    <div class="hero bg-base-200 min-h-full ">
                        <div class="hero-content">

                            <div
                                class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                                <div class="card-body">
                                    <fieldset class="fieldset">
                                        <label class="label">Mobile
                                            Number</label>
                                        <input id="phone-number" type="text"
                                            class="input"
                                            placeholder="Enter Mobile Number" />
                                        <label class="label">4 Digit Pin
                                        </label>
                                        <input id="pin-number" type="password"
                                            class="input"
                                            placeholder="Enter 4 Digit Pin" />
                                        <div><a class="link link-hover">Forgot
                                                password?</a></div>
                                        <button id="btn-login"
                                            class="btn btn-primary mt-4 ">Login</button>
                                    </fieldset>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </main>
            <script src="login.js"></script>
        </body>
    </html>

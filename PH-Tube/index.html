<!DOCTYPE html>
<html lang="en" data-theme='light'>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../PH-Tube/style.css">
    <title> PH-Tube</title>
</head>

<body>

    <header>
        <nav class="w-11/12 mx-auto py-3 flex justify-between items-center border-b">
          <!-- log  -->
            <div class="log w-[100px]"><img class="" src="../PH-Tube/Logo.png" alt=""></div>
            <!-- search  button and input field -->
            <div class="search">
                <label class="input input-bordered flex items-center gap-2">
                    <input type="text" class="grow" placeholder="Search" />
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                        class="h-4 w-4 opacity-70">
                        <path fill-rule="evenodd"
                            d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z"
                            clip-rule="evenodd" />
                    </svg>
                </label>
            </div>
            <div class="sort"> <button class="btn"> SORT</button></div>
        </nav>
    </header>
    <nav class="py-2 flex justify-center gap-5" id="categoriesContainer"></nav>

<main>
    <section id="videos" class="w-11/12 py-2 mx-auto gap-5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4">
<!-- video card will be add in this section  -->
    </section>
</main>

    <script src="../PH-Tube/script.js"></script>
</body>

</html>
